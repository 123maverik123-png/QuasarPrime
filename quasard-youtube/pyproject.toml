[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quasard-youtube"
version = "0.1.0"
description = "YouTube -> local HTTP MP3 -> Yandex Station Glagol bridge for quasard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
quasard-youtube = "quasard_youtube.__main__:main"

[tool.setuptools.packages.find]
include = ["quasard_youtube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
